# ==================================================================
# 3회차 · 3단계 — 리버스 프록시로 CORS 문제를 없앤 최종 설정
# ==================================================================
#
# 2단계(nginx-spa.conf) 내용을 그대로 두고, /api/ 프록시만 추가했습니다.
#
# 문제 상황:
#   앱은 http://localhost (80) 에서 열립니다.
#   API 서버는 http://localhost:3001 에 있습니다.
#   포트가 다르므로 브라우저에게는 "다른 출처(origin)" 입니다.
#   미니 API 는 CORS 헤더를 보내지 않으므로 → 브라우저가 응답을 차단합니다.
#
# 해결 방법 두 가지:
#   (1) API 서버가 Access-Control-Allow-Origin 헤더를 붙인다
#   (2) 애초에 출처를 하나로 만든다  ← 이 파일이 하는 일
#
# 이 설정을 적용하면 브라우저가 보는 주소는 이렇게 됩니다.
#   화면 : http://localhost/
#   API  : http://localhost/api/words
#
#   둘 다 http://localhost 입니다. 프로토콜·호스트·포트가 전부 같습니다.
#   즉 교차 출처가 아니므로 브라우저는 CORS 검사를 아예 하지 않습니다.
#
# ★★★ 그래서 CORS 에러가 "사라집니다" ★★★
#   API 서버 코드는 한 줄도 고치지 않았습니다.
#   서버가 헤더를 붙여서 허락받은 게 아니라,
#   배포 구조를 바꿔서 "교차 출처라는 상황 자체를 없앤" 것입니다.
#
#   브라우저는 nginx 만 상대합니다. nginx 가 뒤에서 mini-api 에게
#   대신 물어보고 그 답을 가져다주는 것은 브라우저가 알지 못합니다.
#   서버끼리의 통신에는 CORS 라는 개념이 존재하지 않습니다. (CORS 는 브라우저 규칙입니다)
#
# 프론트엔드 코드도 함께 바뀝니다.
#   변경 전: fetch('http://localhost:3001/api/words')
#   변경 후: fetch('/api/words')     ← 호스트를 아예 적지 않습니다
#
#   이러면 배포 환경마다 API 주소를 바꿔줄 필요도 없어집니다.
#   (3회차 앞부분에서 다룬 "환경변수가 빌드 시점에 박히는 함정" 도 같이 피해갑니다)
#
# 실습 순서: nginx.conf → nginx-spa.conf → nginx-proxy.conf (여기)
# ==================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------------
    # ① 리버스 프록시 — 이번 단계의 핵심
    # ------------------------------------------------------------------
    # /api/ 로 시작하는 요청은 정적 파일에서 찾지 말고
    # mini-api 컨테이너의 3001 포트로 그대로 넘깁니다.
    location /api/ {
        # proxy_pass 뒤에 "경로 없이" 호스트:포트만 적었다는 점이 중요합니다.
        #
        #   proxy_pass http://mini-api:3001;   ← 원래 경로를 그대로 붙여 보냅니다
        #     브라우저: GET /api/words  →  mini-api: GET /api/words   ✅ 우리가 원하는 것
        #
        #   proxy_pass http://mini-api:3001/;  ← 끝에 / 를 붙이면 /api 를 떼고 보냅니다
        #     브라우저: GET /api/words  →  mini-api: GET /words       ❌ 404
        #
        # 끝의 슬래시 하나로 동작이 완전히 달라집니다. 아주 흔한 실수입니다.
        # 우리 API 는 /api/words 로 서빙하므로 슬래시를 붙이지 않습니다.
        #
        # 'mini-api' 는 docker-compose.yml 에 적은 서비스 이름입니다.
        # 같은 compose 네트워크 안에서는 서비스 이름이 곧 호스트 이름이 됩니다.
        #
        # ★ 이 설정은 반드시 docker compose 로 띄우세요.
        #   docker run 으로 이 파일만 단독 실행하면 nginx 가 시작하자마자 죽습니다.
        #
        #     nginx: [emerg] host not found in upstream "mini-api"
        #
        #   nginx 는 시작할 때 upstream 이름을 한 번에 해석하는데,
        #   compose 밖에서는 'mini-api' 라는 이름이 존재하지 않기 때문입니다.
        #   단독으로 시험해보고 싶다면 아래 location /api/ 블록을 통째로 주석 처리하세요.
        # (docker 내장 DNS 가 알아서 컨테이너 IP 로 바꿔줍니다)
        proxy_pass http://mini-api:3001;

        # ---- proxy_set_header 기본 3종 ----
        # 프록시를 거치면 뒷단 서버는 "누가 진짜 요청자인지" 알 수 없게 됩니다.
        # 뒷단이 보는 것은 nginx 뿐이기 때문입니다.
        # 그래서 원래 정보를 헤더에 담아 같이 넘겨줍니다.

        # 브라우저가 원래 입력한 호스트 이름 (예: localhost, myapp.com)
        # 이걸 안 넘기면 뒷단은 Host 를 'mini-api' 로 보게 됩니다.
        proxy_set_header Host $host;

        # 실제 접속자의 IP
        proxy_set_header X-Real-IP $remote_addr;

        # 프록시를 여러 번 거칠 수 있으므로 IP 를 쉼표로 이어붙입니다.
        # $proxy_add_x_forwarded_for 는 기존 값 뒤에 현재 IP 를 추가해 줍니다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # (참고) 원래 요청이 http 였는지 https 였는지 알려주는 헤더입니다.
        # 필수는 아니지만 실무에서는 거의 항상 같이 넣습니다.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # ② index.html — 캐시 금지 (2단계와 동일)
    # ------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # ③ 해시 붙은 정적 자산 — 1년 캐시 (2단계와 동일)
    # ------------------------------------------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # ④ SPA fallback (2단계와 동일)
    # ------------------------------------------------------------------
    # 주의: /api/ 블록이 이 블록보다 먼저 매칭되기 때문에
    # API 요청이 index.html 로 새어 나가지 않습니다.
    # (nginx 는 접두사 location 중 "가장 길게 일치하는 것"을 고릅니다.
    #  /api/words 는 / 와 /api/ 둘 다에 걸리지만 더 긴 /api/ 가 이깁니다)
    #
    # 만약 이 순서를 잘못 잡아서 API 요청이 index.html 로 가버리면
    # 프론트엔드에서 "JSON 인 줄 알았는데 HTML 이 왔다" 는 에러를 보게 됩니다.
    #   Unexpected token '<', "<!doctype "... is not valid JSON
    location / {
        try_files $uri $uri/ /index.html;
    }
}
