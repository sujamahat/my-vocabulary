# ==================================================================
# 3회차 · 2단계 — SPA fallback 을 추가해 새로고침 404 를 고친 설정
# ==================================================================
#
# 1단계(nginx.conf)에서 만난 문제:
#   /about 에서 새로고침하면 404 가 났습니다.
#   dist/ 안에 about 이라는 파일이 실제로 없기 때문입니다.
#
# 해결:
#   "찾는 파일이 없으면 대신 index.html 을 줘라" 라고 nginx 에게 알려줍니다.
#   그러면 브라우저가 index.html 을 받고 → JS 가 실행되고 →
#   React Router 가 주소창의 /about 을 보고 알맞은 화면을 그립니다.
#
# 바뀐 것은 딱 한 글자 수준입니다. try_files 의 마지막 인자.
#   1단계: try_files $uri $uri/ =404;
#   2단계: try_files $uri $uri/ /index.html;
#
# 여기에 더해 정적 자산 캐시 설정도 함께 넣었습니다. (아래 주석 참고)
#
# 실습 순서: nginx.conf → nginx-spa.conf (여기) → nginx-proxy.conf
# ==================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # gzip 압축
    # ------------------------------------------------------------------
    # JS 번들은 텍스트라서 압축이 아주 잘 듭니다 (보통 1/3 이하로 줄어듭니다).
    # 전송량이 줄면 첫 화면이 뜨는 속도가 그만큼 빨라집니다.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;   # 너무 작은 파일은 압축해봐야 이득이 없습니다

    # ------------------------------------------------------------------
    # ① index.html — 절대 캐시하지 않는다
    # ------------------------------------------------------------------
    # index.html 은 "어떤 JS 파일을 불러올지" 를 적어둔 목차입니다.
    # 이 파일이 브라우저에 캐시되면, 새로 배포해도 사용자는 옛날 목차를 보고
    # 옛날 JS 를 계속 불러옵니다. → "배포했는데 왜 안 바뀌죠?" 사건 발생.
    #
    # 그래서 index.html 만큼은 매번 서버에 새로 물어보게 만듭니다.
    #
    # ※ 이 location 블록이 아래 location / 보다 먼저 매칭됩니다.
    #   nginx 는 = (정확히 일치) 를 가장 높은 우선순위로 처리합니다.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # ② 해시가 붙은 정적 자산 — 1년 캐시 + immutable
    # ------------------------------------------------------------------
    # Vite 로 빌드하면 dist/assets/ 안의 파일 이름에 해시가 붙습니다.
    #   예) index-4f3a9c21.js , index-b7e2d105.css
    #
    # 내용이 바뀌면 해시가 바뀌고 = 파일 이름 자체가 바뀝니다.
    # 즉 "같은 이름인데 내용이 다른 파일"이 존재할 수 없습니다.
    # 그래서 마음 놓고 아주 길게(1년) 캐시해도 안전합니다.
    #
    # immutable 은 "이 파일은 절대 안 바뀌니 유효한 동안은 다시 물어보지도 마라"
    # 라는 뜻입니다. 새로고침해도 재검증 요청조차 보내지 않습니다.
    #
    # ※ max-age 31536000 은 1년을 초로 환산한 값입니다 (60*60*24*365).
    #   nginx 의 expires 1y; 지시어를 함께 쓰면 Cache-Control 헤더가
    #   두 줄로 중복되니, 여기서는 add_header 하나만 사용합니다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # ③ SPA fallback — 이번 단계의 핵심
    # ------------------------------------------------------------------
    location / {
        # $uri        : 요청한 경로와 같은 이름의 파일을 찾는다
        # $uri/       : 디렉터리를 찾는다
        # /index.html : 둘 다 없으면 index.html 을 내려준다  ← 이게 fallback
        #
        # 이 한 줄 덕분에 /about, /words/proxy 어떤 주소로 새로고침해도
        # 404 대신 index.html 이 내려가고, React Router 가 화면을 그립니다.
        try_files $uri $uri/ /index.html;
    }
}
