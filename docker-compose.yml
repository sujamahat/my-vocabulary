# 앱(nginx) + 미니 API 를 한 번에:  docker compose up --build  →  http://localhost:8080
services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: ""                 # 빌드 시점 주입 — 비워서 상대경로 /api 사용
        NGINX_CONF: nginx-proxy.conf     # /api/ → mini-api:3001 리버스 프록시
    container_name: study-web
    ports:
      - "8080:80"
    depends_on:
      mini-api:
        condition: service_healthy       # API가 "준비 완료"된 뒤에 nginx 시작

  mini-api:
    build:
      context: ./mini-api
    container_name: study-mini-api
    # ports 없음 — 일부러. 바깥에서는 못 들어오고, nginx 만 이름(mini-api)으로 접근
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
